version: '3'

# Local dev convenience only. Formatting, vet diagnostics, linting and test
# running/coverage are handled by the VS Code Go extension in the editor,
# and enforced independently in CI (see .github/workflows/ci.yml and
# .github/workflows/release.yml) - they're intentionally not duplicated here.

vars:
  APP_NAME: go-time-recording
  BIN_DIR: bin
  # Build scratch space for tests, kept out of %TEMP% - see the test task.
  TMP_DIR: bin/gotmp
  CONFIG_SRC: cmd/configs
  # Docker registry to push images to, e.g. ghcr.io/dennis-dko. Empty by
  # default so a push without a target fails loudly instead of going nowhere.
  REGISTRY: ''
  # Image/build version. Defaults to the nearest git tag (or short SHA if
  # there is none yet). Override explicitly for releases: task release VERSION=v1.2.3
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev"

tasks:
  default:
    desc: Build the application for the default (dev) environment.
    cmds:
      - task: build

  build:
    desc: Build the application for the dev environment.
    cmds:
      - task: build:env
        vars:
          ENV: dev

  build:env:
    desc: 'Build the application. Usage: task build:env ENV=staging (selects which config the binary loads at run time)'
    deps: [clean, tidy]
    vars:
      ENV: '{{.ENV | default "dev"}}'
    cmds:
      # The artifact itself is environment-independent: GoFr picks its config
      # file from APP_ENV at start-up, so ENV only matters when running. It is
      # echoed here so the build log states which environment is intended.
      - echo "Building application (intended for {{.ENV}}, version {{.VERSION}})"
      - mkdir -p {{.BIN_DIR}}
      - cp -r {{.CONFIG_SRC}} {{.BIN_DIR}}/
      - go build -ldflags "-X main.version={{.VERSION}}" -o ./{{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}} ./cmd/main.go

  run:
    desc: 'Build and run the application. Usage: task run ENV=staging (default: dev)'
    cmds:
      - task: build:env
        vars: { ENV: '{{.ENV | default "dev"}}' }
      - task: run:binary
        vars: { ENV: '{{.ENV | default "dev"}}' }

  run:binary:
    internal: true
    # Must run from BIN_DIR: GoFr resolves its configuration as ./configs
    # relative to the working directory, and build:env puts them there.
    # Starting from the repository root leaves the app with no database.
    dir: '{{.BIN_DIR}}'
    # APP_ENV has to be set here rather than at build time: it selects the
    # config file GoFr loads on start-up and is not compiled into the binary.
    env:
      APP_ENV: '{{.ENV}}'
    cmds:
      - ./{{.APP_NAME}}{{exeExt}}

  clean:
    desc: Remove build artifacts.
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -f coverage.out

  tidy:
    desc: Ensure go.mod and go.sum are tidy.
    cmds:
      - go mod tidy

  test:
    desc: Run all unit and integration tests.
    deps: [tidy]
    # Go writes each test binary to %TEMP%/go-build before running it, and
    # real-time virus scanning on Windows intermittently locks those files -
    # "Access is denied" on a package that compiles perfectly well. Building
    # under the project directory avoids the scanned path entirely.
    env:
      # Absolute: the tests run from their own package directories, so a
      # relative path would resolve somewhere different for each of them.
      GOTMPDIR: '{{.ROOT_DIR}}/{{.TMP_DIR}}'
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -Command "New-Item -ItemType Directory -Force {{.TMP_DIR}} | Out-Null"{{else}}mkdir -p {{.TMP_DIR}}{{end}}'
      - defer: '{{if eq OS "windows"}}powershell -NoProfile -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue {{.TMP_DIR}}"{{else}}rm -rf {{.TMP_DIR}}{{end}}'
      - go test ./...

  test:env:up:
    desc: 'Start the throwaway test services. Usage: task test:env:up PROFILE=postgres|mysql|ldap|all'
    vars:
      PROFILE: '{{.PROFILE | default "all"}}'
    dir: test
    cmds:
      - docker compose --profile {{.PROFILE}} up -d --wait
      - echo "Ready. See test/README.md for connection details."

  test:env:down:
    desc: Stop the test services and delete their data.
    dir: test
    cmds:
      # --profile all so nothing is left behind whichever profile was started.
      - docker compose --profile all down -v

  test:probe:
    desc: 'Check a database and directory connection using the application''s own drivers. Usage: task test:probe -- --ldap ldap://localhost:5389'
    cmds:
      - go run ./test/probe {{.CLI_ARGS}}

  upgrade:
    desc: Bump go.mod to the installed Go toolchain and update all dependencies to their latest compatible releases.
    cmds:
      - |
        GOVERSION=$(go env GOVERSION)
        echo "Bumping go.mod to ${GOVERSION#go}"
        go get go@${GOVERSION#go}
      - go get -u ./...
      - task: test
      - echo "Done. Remember to also bump the base image in Dockerfile (FROM golang:...) if it changed."

  version:
    desc: Print the version used for builds, images, and releases.
    cmds:
      - echo "{{.VERSION}}"

  docker:build:
    desc: Build the Docker image, tagged with the version and "latest".
    deps: [test]
    cmds:
      - docker build -t {{.APP_NAME}}:{{.VERSION}} -t {{.APP_NAME}}:latest .

  docker:push:
    desc: 'Push the Docker image to REGISTRY. Usage: task docker:push REGISTRY=ghcr.io/you'
    deps: [docker:build]
    preconditions:
      - sh: '[ -n "{{.REGISTRY}}" ]'
        msg: 'REGISTRY is not set. Usage: task docker:push REGISTRY=ghcr.io/you'
    cmds:
      - docker tag {{.APP_NAME}}:{{.VERSION}} {{.REGISTRY}}/{{.APP_NAME}}:{{.VERSION}}
      - docker tag {{.APP_NAME}}:latest {{.REGISTRY}}/{{.APP_NAME}}:latest
      - docker push {{.REGISTRY}}/{{.APP_NAME}}:{{.VERSION}}
      - docker push {{.REGISTRY}}/{{.APP_NAME}}:latest

  release:
    desc: 'Tag a release; the release workflow in CI builds, verifies, and publishes it. Usage: task release VERSION=v1.2.3'
    preconditions:
      - sh: echo "{{.VERSION}}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'
        msg: 'VERSION must be a semantic version, e.g. task release VERSION=v1.2.3'
    cmds:
      - git tag -a {{.VERSION}} -m "Release {{.VERSION}}"
      - git push origin {{.VERSION}}
