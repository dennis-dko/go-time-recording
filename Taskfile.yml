version: '3'

# Three things this file is for, in the order a change travels through them:
#
#   develop   task dev      local binary, fast rebuild, real backing services
#   verify    task stage    the shipped container image, against real services
#   ship      task release  a git tag; CI builds, publishes and releases
#
# Formatting, vet diagnostics and linting are deliberately absent: the VS Code
# Go extension covers them while editing, and ci.yml enforces them independently
# on every push. Duplicating them here would only create a third place to keep
# in step.

vars:
  APP_NAME: go-time-recording
  BIN_DIR: bin
  CONFIG_SRC: cmd/configs

  # Build scratch space for tests, kept out of %TEMP% - see the test task.
  TMP_DIR: bin/gotmp

  # Image and build version. Defaults to the nearest git tag (or the short SHA
  # if there is none yet). Override for releases: task release VERSION=v1.2.3
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-dev"

tasks:
  default:
    desc: Show what is available.
    silent: true
    cmds:
      - task --list

  # ----------------------------------------------------------------- develop

  dev:
    desc: 'Develop: build and run against real backing services. Ctrl-C to stop.'
    summary: |
      Starts PostgreSQL and the seeded test directory, waits until both are
      genuinely usable rather than merely listening, then builds and runs the
      application connected to them.

      The application runs in the foreground. Ctrl-C stops it and leaves the
      containers up, so the next start is quick.

      LDAP is not configured through the environment - it is administered in the
      running application under Settings. test/README.md lists the values, and
      the seeded accounts that make the synchronisation's edge cases
      reproducible.

      Usage:
        task dev                 PostgreSQL and the directory
        task dev DB=sqlite       no containers at all, straight onto a local file
        task dev PROFILE=all     ...and MySQL too
    cmds:
      - task: '{{if eq .DB "sqlite"}}dev:sqlite{{else}}dev:services{{end}}'

  dev:services:
    internal: true
    cmds:
      # "dev", not "all": MySQL is a compatibility check, not something to wait
      # for on every start.
      - task: env:up
        vars: { PROFILE: '{{.PROFILE | default "dev"}}' }
      - task: build
      - task: dev:binary
        vars:
          MESSAGE: 'PostgreSQL on localhost:55432'
          DB_DIALECT: postgres
          DB_HOST: localhost
          DB_PORT: '55432'
          DB_USER: gtr
          DB_PASSWORD: gtr-test-password
          DB_SSL_MODE: disable

  dev:sqlite:
    internal: true
    cmds:
      - task: build
      - task: dev:binary
        vars:
          MESSAGE: 'a local SQLite file'
          DB_DIALECT: sqlite

  dev:binary:
    internal: true
    # Must run from BIN_DIR: GoFr resolves its configuration as ./configs
    # relative to the working directory, and build puts them there. Starting
    # from the repository root leaves the application with no database.
    dir: '{{.BIN_DIR}}'
    env:
      # APP_ENV selects the config file GoFr loads at start-up. It is read at
      # run time, not compiled in, so it belongs here rather than in the build.
      APP_ENV: dev
      DB_DIALECT: '{{.DB_DIALECT}}'
      DB_NAME: '{{.APP_NAME}}'
      DB_HOST: '{{.DB_HOST}}'
      DB_PORT: '{{.DB_PORT}}'
      DB_USER: '{{.DB_USER}}'
      DB_PASSWORD: '{{.DB_PASSWORD}}'
      DB_SSL_MODE: '{{.DB_SSL_MODE}}'
    cmds:
      # A datasource.json written by the Settings screen in an earlier session
      # is applied *before* GoFr reads its configuration and overwrites every
      # DB_* variable above - so this task would silently connect somewhere
      # else. Removing it is what keeps `task dev` mean one thing.
      - rm -f configs/datasource.json
      - echo "Starting against {{.MESSAGE}} - open http://localhost:8000"
      - ./{{.APP_NAME}}{{exeExt}}

  # ------------------------------------------------------------------ verify

  test:all:
    desc: 'Verify: every suite - unit, integration, directory, traces, browser. Usage: task test:all DB=postgres'
    summary: |
      Runs every suite in the order that fails fastest: the unit tests first,
      because a compile error or a broken rule should not be found after twenty
      minutes of browser automation.

      Each suite is also a task of its own, and running one directly is the
      normal thing to do while working:

        task test               the rules, in memory, seconds
        task test:integration   the real binary over HTTP
        task test:ldap          against a real directory        (docker)
        task test:traces        against a real collector        (docker)
        task test:browser       the real interface in a real browser

      The last two need containers, and are here rather than on the side because
      the two things they cover fail silently by nature. A directory entry that
      cannot be keyed on produces an account the synchronisation later deletes
      together with its recorded hours; an exporter GoFr cannot build drops every
      span after one log line. Neither shows up in a suite that stubs them out,
      which is how both went unnoticed until something ran them for real.

      Docker is therefore required. `task test` on its own stays containerless
      and is the one to run while working.

      With DB=postgres or DB=mysql the integration suite is run twice, against
      the server and then against SQLite. That second pass is what lets this
      task claim to run everything: a handful of cases start two instances
      against one shared database file - what an administrator saves being
      applied by the next start - and the harness gives each instance a database
      of its own on a server, so on a server those cases skip themselves and the
      run still reports success. Skipping quietly is exactly what this task
      exists to prevent.

      What it does not cover: the shipped container image, which is `task
      stage`; more than one dialect per run, so all three means running it three
      times or letting ci.yml do it; and the dialect in any suite but the
      integration one - the directory, tracing and browser legs always run on
      SQLite, because what they cover has nothing to do with the dialect.

      Linting is deliberately not part of this. It is not a test, it needs the
      version pinned in .golangci-lint-version to mean the same thing here as
      in CI, and ci.yml enforces it independently on every push.

      Usage:
        task test:all              integration leg against SQLite
        task test:all DB=postgres  ...against PostgreSQL, then SQLite as well
        task test:all DB=mysql     ...against MySQL, then SQLite as well
    cmds:
      # Registered first so it runs whichever suite fails. It takes a staging
      # environment with it, and there is no way around that: `task stage` runs
      # against the same PostgreSQL container these tests do, so ending this run
      # cleanly and leaving that one standing is not a choice this can make.
      #
      # A single failing suite is re-run on its own afterwards - and `task
      # test:ldap` and `task test:traces` each leave their container up for
      # looking at, which is where a failure gets read rather than guessed at.
      - defer: { task: env:down }
      - task: test
      - task: test:integration
        vars: { DB: '{{.DB}}' }
      # The whole suite again rather than a list of the case names that skip:
      # the list would go stale the first time somebody adds another one, and a
      # test nobody notices is not running is the thing this pass is here for.
      - '{{if or (eq .DB "postgres") (eq .DB "mysql")}}task test:integration{{end}}'
      - task: test:ldap
      - task: test:traces
      - task: test:browser
      - echo "All suites passed, including the directory and the trace collector."
      - echo "Containers and their data are gone; task stage is what leaves an environment standing."

  test:
    desc: 'Verify: run the unit tests.'
    deps: [tidy]
    # Go writes each test binary to %TEMP%/go-build before running it, and
    # real-time virus scanning on Windows intermittently locks those files -
    # "Access is denied" on a package that compiles perfectly well. Building
    # under the project directory avoids the scanned path entirely.
    env:
      # Absolute: the tests run from their own package directories, so a
      # relative path would resolve somewhere different for each of them.
      GOTMPDIR: '{{.ROOT_DIR}}/{{.TMP_DIR}}'
    cmds:
      - mkdir -p {{.TMP_DIR}}
      - defer: rm -rf {{.TMP_DIR}}
      - go test ./...

  test:integration:
    desc: 'Verify: drive the real binary over HTTP, end to end. Usage: task test:integration DB=postgres'
    summary: |
      Builds the application and talks to it over HTTP, the way a browser and a
      script do. Nothing is stubbed: the middleware order, the CSRF check, the
      session cookie, the migrations and the embedded assets are all in the
      path - which is where every bug found by running this application rather
      than testing it has lived.

      Slower than the unit tests, because each case starts its own instance, so
      it is a separate task rather than part of `task test`. CI runs both, and
      against both dialects.

      Usage:
        task test:integration              against SQLite, a file per test
        task test:integration DB=postgres  against `task env:up PROFILE=postgres`
        task test:integration DB=mysql     against `task env:up PROFILE=mysql`
    env:
      GOTMPDIR: '{{.ROOT_DIR}}/{{.TMP_DIR}}'
      # Empty for SQLite: the harness then gives each instance its own file.
      # root on MySQL: each test creates its own database, which an ordinary
      # MySQL user is not allowed to do. A throwaway server either way.
      GTR_TEST_DSN: '{{if eq .DB "postgres"}}postgres://gtr:gtr-test-password@localhost:55432/go-time-recording?sslmode=disable{{else if eq .DB "mysql"}}mysql://root:gtr-test-root@localhost:53306/go-time-recording{{end}}'
    # Starting the server it needs, rather than failing with "connection
    # refused" and leaving the reader to work out which container was missing.
    cmds:
      - '{{if or (eq .DB "postgres") (eq .DB "mysql")}}task env:up PROFILE={{.DB}}{{end}}'
      - mkdir -p {{.TMP_DIR}}
      - defer: rm -rf {{.TMP_DIR}}
      - go test -tags integration -count=1 -timeout 15m ./test/integration/

  test:ldap:
    desc: 'Verify: sign in against a real directory, and check nobody gets deleted for it.'
    summary: |
      internal/infrastructure/directory is the one package here that talks to
      something this project does not control, and the synchronisation tests
      drive a fake - which proves the rules and nothing about the LDAP: not the
      bind, not the filter substitution, not the attribute names.

      The case that matters most is the last one: an entry that can sign in but
      does not appear in the directory listing produces an account the next
      synchronisation reads as a departure, and deletes together with every hour
      recorded against it. That cannot be checked against a fake, because a fake
      returns whatever the test told it to.

      Starts the directory and leaves it running; test/README.md documents the
      seeded accounts, and phpLDAPadmin is on http://localhost:5080 for looking
      at one by hand. `task env:down` stops it.
    env:
      GOTMPDIR: '{{.ROOT_DIR}}/{{.TMP_DIR}}'
      GTR_TEST_LDAP: 'localhost:5389'
    cmds:
      - task: env:up
        vars: { PROFILE: ldap }
      - mkdir -p {{.TMP_DIR}}
      - defer: rm -rf {{.TMP_DIR}}
      - go test -tags integration -count=1 -timeout 10m -run 'Directory|LDAP|BaseDN|MailAddress|Synchronisation|NeverProposed' ./test/integration/

  test:traces:
    desc: 'Verify: export spans to a real Jaeger and read them back.'
    summary: |
      The one thing the rest of the tracing tests cannot show: that a span
      exported by this application actually arrives somewhere. Every way that
      fails is silent - an exporter GoFr does not recognise drops each batch
      after logging once, a collector address it cannot dial fails inside the
      exporter, and a sampler that records nothing looks exactly like a
      collector with nothing to show.

      Starts Jaeger, runs the tracing tests against it, and leaves it running so
      a failure can be looked at in the trace browser on http://localhost:51686.
      `task env:down` stops it.
    env:
      GOTMPDIR: '{{.ROOT_DIR}}/{{.TMP_DIR}}'
      GTR_TEST_JAEGER: 'localhost:54317'
    cmds:
      - task: env:up
        vars: { PROFILE: traces }
      - mkdir -p {{.TMP_DIR}}
      - defer: rm -rf {{.TMP_DIR}}
      # Only the tracing cases: the rest of the integration suite is `task
      # test:integration`, and running it twice for these two is minutes wasted.
      # Both tracing cases carry "Tracing" in their name; the rest of the
      # integration suite is `task test:integration`, and running it again for
      # these two is minutes wasted.
      - go test -tags integration -count=1 -timeout 10m -run Tracing ./test/integration/

  test:browser:
    desc: 'Verify: drive the real interface in a real browser.'
    summary: |
      Starts the application and clicks through it with Chrome, Chromium or
      Edge - whichever is installed. Set CHROME_PATH if it lives somewhere
      unusual.

      This covers what the API tests cannot: whether the application is
      *usable*. A sign-in overlay that never goes away, a tab that highlights
      but changes nothing, a stylesheet rule that quietly beats the hidden
      attribute - every one of those leaves the API perfectly healthy.

      This project shipped exactly that: a sign-in form that authenticated
      correctly and then left the overlay on screen. Every API check passed.
    env:
      GOTMPDIR: '{{.ROOT_DIR}}/{{.TMP_DIR}}'
    cmds:
      - mkdir -p {{.TMP_DIR}}
      - defer: rm -rf {{.TMP_DIR}}
      - go test -tags browser -count=1 -timeout 20m ./test/browser/

  stage:
    desc: 'Verify: run the shipped container image against all of it - database, directory, collector.'
    summary: |
      Builds the actual deployment image from the repository Dockerfile and runs
      it against everything it can be exercised against at once: PostgreSQL, the
      seeded directory, a collector the exported spans have to arrive in, and a
      browser for the directory. One command, so "does the real artifact work
      with all of it" is not a set of profiles assembled by hand, with the one
      that was left out found out about later.

      This is what `task dev` is not. Development runs a binary compiled on your
      machine, which is fast but is not the artifact anyone deploys. This goes
      through the real image - multi-stage build, embedded assets, non-root
      user, healthcheck, prod configuration - so what is tested is what will be
      running.

        application   http://localhost:8080   admin@local / changeme123
        metrics       http://localhost:8021/metrics
        traces        http://localhost:51686
        directory     http://localhost:5080

      All deliberately not the usual ports, so a development instance and
      anything already listening can keep running alongside it.

      Two things it starts but does not configure for you. Tracing is set
      through the environment in test/docker-compose.yml, so spans arrive from
      the first request. The directory is not, because the application does not
      read LDAP from the environment at all - it is administered under Settings,
      and until the values in test/README.md are entered there the image is
      running beside a directory it has never contacted.

      What it does not cover: MySQL and SQLite, since the image is run against
      the dialect a deployment uses and the other two are the integration
      suite's question, not the image's; and anything that has to be clicked or
      requested, because this starts an environment rather than exercising one.
      `task test:all` is what exercises it.

      Usage:
        task stage           start it
        task stage:logs      follow the application log
        task stage:down      stop it and delete the data
    dir: test
    cmds:
      - docker compose --profile stage up -d --build --wait
      # Healthy containers and a reachable network are different statements, and
      # only the second one is worth starting to click through: the probe opens
      # both connections from inside the network with the application's own
      # drivers. --rm because it is one check and then gone; a stopped container
      # left behind is something the next `docker compose ps` reports as part of
      # the environment. A failure here leaves everything standing, which is
      # what makes it possible to look at.
      - docker compose --profile probe run --rm probe
      - echo "Staging is up. Ports of its own, so a development instance can keep running."
      - echo "  application   http://localhost:8080 - admin@local / changeme123"
      - echo "  metrics       http://localhost:8021/metrics"
      - echo "  traces        http://localhost:51686 - spans arrive seconds after a request"
      - echo "  directory     http://localhost:5080 - not configured yet, see test/README.md"

  stage:logs:
    desc: 'Verify: follow the staging application log.'
    dir: test
    cmds:
      - docker compose --profile stage logs -f app

  stage:down:
    desc: 'Verify: stop the staging environment and delete its data.'
    dir: test
    cmds:
      - docker compose --profile stage down -v

  probe:
    desc: 'Verify: check a database or directory connection using the application''s own drivers. Usage: task probe -- --ldap ldaps://dc.corp.example'
    summary: |
      Opens the connection with the same drivers the application uses and runs
      the same kind of query, which is what makes a pass mean something: a port
      check proves a socket answers, not that this binary can authenticate.

      For a directory it also reports whether every entry carries the stable
      identifier the synchronisation matches on. Without it, accounts are
      matched by mail address - and renaming a mailbox then deletes the account
      together with every hour recorded against it. Worth running before
      pointing a real installation at a real directory.
    cmds:
      - go run ./test/probe {{.CLI_ARGS}}

  env:up:
    desc: 'Verify: start the backing services on their own. Usage: task env:up PROFILE=dev|postgres|mysql|ldap|traces|all'
    vars:
      PROFILE: '{{.PROFILE | default "all"}}'
    dir: test
    cmds:
      - docker compose --profile {{.PROFILE}} up -d --wait
      - echo "Ready. See test/README.md for connection details."

  env:down:
    desc: 'Verify: stop every container this project starts and delete their data.'
    dir: test
    cmds:
      # Every profile, so nothing is left behind whichever one was started.
      - docker compose --profile all --profile stage --profile probe down -v

  # -------------------------------------------------------------------- ship

  build:
    desc: 'Ship: build the binary into bin/, with its configuration beside it.'
    deps: [tidy]
    cmds:
      # The artifact is environment-independent: GoFr picks its config file from
      # APP_ENV at start-up, so there is nothing to choose here.
      - echo "Building {{.APP_NAME}} {{.VERSION}}"
      - mkdir -p {{.BIN_DIR}}
      - cp -r {{.CONFIG_SRC}} {{.BIN_DIR}}/
      # On Windows, the icon and the Properties tab - the same resource the
      # release builds, so a binary built here is not a different artefact from
      # the published one. Needs goversioninfo on PATH; without it the build goes
      # ahead unadorned rather than failing, because a missing tool is not a
      # reason to be unable to build the application.
      - '{{if eq OS "windows"}}sh build/windows-resource.sh {{.VERSION}} || echo "no goversioninfo on PATH - building without the resource"{{end}}'
      # ./cmd rather than ./cmd/main.go: naming the file builds that file, and a
      # .syso beside it in the package is not picked up.
      - go build -ldflags "-X main.version={{.VERSION}}" -o ./{{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}} ./cmd
      - '{{if eq OS "windows"}}sh build/windows-resource.sh --clean{{end}}'

  image:
    desc: 'Ship: build the deployment image, tagged with the version and "latest".'
    deps: [test]
    cmds:
      - docker build -t {{.APP_NAME}}:{{.VERSION}} -t {{.APP_NAME}}:latest .
      - echo "Built {{.APP_NAME}}:{{.VERSION}}"

  release:
    desc: 'Ship: tag a minor or major version by hand. Usage: task release VERSION=v1.2.0'
    summary: |
      Only needed for a minor or major bump. A patch release happens on its own:
      every merge to main reads the newest tag, counts the patch number on, and
      publishes the image and the GitHub release - so there is nothing to run and
      no version written down anywhere to forget.

      This tags the current commit with the version given and pushes it, which
      release.yml picks up and releases as exactly that version. The next merge
      then counts on from it.

      Usage:
        task release VERSION=v1.2.0
    preconditions:
      - sh: echo "{{.VERSION}}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'
        msg: 'VERSION must be a semantic version, e.g. task release VERSION=v1.2.3'
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: 'Working tree is not clean. Commit or stash first, or the tag will not match what is built.'
    cmds:
      - git tag -a {{.VERSION}} -m "Release {{.VERSION}}"
      - git push origin {{.VERSION}}

  # ---------------------------------------------------------------- upkeep

  tidy:
    desc: 'Upkeep: ensure go.mod and go.sum are tidy.'
    cmds:
      - go mod tidy

  upgrade:
    desc: 'Upkeep: bump go.mod to the installed toolchain and update dependencies.'
    cmds:
      - |
        GOVERSION=$(go env GOVERSION)
        echo "Bumping go.mod to ${GOVERSION#go}"
        go get go@${GOVERSION#go}
      - go get -u ./...
      - task: test
      - echo "Done. Remember to bump the base images in Dockerfile and deploy/ldap/Dockerfile if the toolchain moved."

  clean:
    desc: 'Upkeep: remove everything testing and building leave behind.'
    summary: |
      Build output, containers, volumes, locally built images and any instance
      still holding a database file open.

      That last one is the reason this is more than `rm -rf bin`. A run that was
      interrupted - Ctrl-C at the wrong moment, a test binary that outlived its
      test - leaves the application running, and on Windows it keeps the SQLite
      file open, so removing the directory fails with "Device or resource busy"
      and the next build inherits the mess.

      Usage:
        task clean        build output, containers, volumes, stray processes
        task clean:images ...and the images built locally
    cmds:
      # Processes first: they are what holds the files the next step deletes.
      - task: clean:processes
      - task: env:down
      - rm -rf {{.BIN_DIR}}
      - rm -f coverage.out
      - echo "Clean. Locally built images are kept - task clean:images removes those too."

  clean:processes:
    internal: true
    # Ignored errors throughout: "no such process" is the normal outcome and not
    # a failure, and this must never be the reason `task clean` stops.
    cmds:
      - cmd: '{{if eq OS "windows"}}taskkill /F /IM {{.APP_NAME}}.exe{{else}}pkill -f {{.APP_NAME}}{{end}}'
        ignore_error: true
      # The harness builds to app.exe; a test killed mid-run leaves it behind.
      - cmd: '{{if eq OS "windows"}}taskkill /F /IM app.exe{{else}}true{{end}}'
        ignore_error: true

  clean:images:
    desc: 'Upkeep: remove the container images built locally by task image and task stage.'
    summary: |
      Separate from `task clean` because images are expensive to rebuild and
      cheap to keep, so deleting them should be asked for rather than assumed.

      Only images built here are touched. A published image pulled from the
      registry is left alone.
    cmds:
      - cmd: docker rmi {{.APP_NAME}}:{{.VERSION}} {{.APP_NAME}}:latest
        ignore_error: true
      - cmd: docker rmi gtr-test-app:latest gtr-test-probe:latest gtr-test-openldap:latest
        ignore_error: true
      - docker image prune -f
      - echo "Locally built images removed."
