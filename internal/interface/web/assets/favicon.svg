<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Time Recording">
  <!-- A stopwatch, drawn rather than typed. The tab icon used to be the ⏱
       character in an inline data URI, which is a font glyph: it renders as a
       different picture on every platform and as a hollow box where the font is
       missing. Paths look the same everywhere and need no font at all. -->
  <title>Time Recording</title>
  <g fill="none" stroke="#2f6fed" stroke-width="2.4" stroke-linecap="round">
    <!-- The crown and the two lugs, which is what makes it a stopwatch rather
         than a clock. -->
    <path d="M13 3h6" />
    <path d="M16 3v3" />
    <path d="M25.5 8.5 27 7" />
    <!-- The case. -->
    <circle cx="16" cy="18" r="11" />
    <!-- The hand, at ten past, so it reads as running rather than as noon. -->
    <path d="M16 18V11.5" />
    <path d="M16 18h4.5" stroke-width="2" />
  </g>
</svg>
