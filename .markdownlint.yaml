# markdownlint configuration for this repository.
#
# In a file rather than in .vscode/settings.json, because the extension's
# markdownlint.config setting is deprecated as of 0.62.1: "Please use a
# configuration file like .markdownlint.json/.markdownlint.yaml instead." YAML of
# the two, so that the reasoning below survives - JSON has nowhere to put it, and
# the reasoning is the part worth keeping.
#
# A file also reaches further than the editor: markdownlint-cli2 reads the same
# one, so a later CI step or a hook applies exactly these rules rather than a
# second copy that drifts from this one.

# MD013 is line length, 80 columns by default, and it is the only rule switched
# off here.
#
# Measured on this tree rather than assumed: it fires on 224 of CLAUDE.md's 286
# lines, and 647 times across the repository's markdown - 287 of those in
# README.md and 115 in deploy/OPERATIONS.md. The prose here is one paragraph per
# bullet and is meant to be read wrapped rather than hard-wrapped, so those 224
# are the document working as intended. CLAUDE.md is also the most-read file in
# the repository, which makes 224 warnings on it the fastest way to teach
# somebody that the Problems panel is not worth opening.
MD013: false

# The rest of what it reported has now been read, which is what the sentence that
# used to stand here asked for. Most of it was fixed rather than silenced: list
# markers made consistent, the table separator spaced, the one fenced block given
# blank lines and a language. Two rules are left off, and both for the same
# reason - they measure a shape CLAUDE.md uses deliberately.

# MD029 is the numbering of an ordered list, and here the numbers are names.
#
# Section 2's audit workflow is six numbered steps, and the document refers to
# them by number - "step 4", "step 2 of the Agentic Auditing Workflow", and again
# from the prompt cheatsheet in Section 8. The rule wants either all-ones or an
# unbroken run, and reports the sixth step as "Expected: 1; Actual: 6" because the
# deeply nested content under step 5 reads to it as the end of the list. Obeying
# it means either renumbering every step to "1." - which breaks every reference in
# the file - or flattening step 5, which is the longest and most load-bearing of
# the six.
MD029: false

# MD007 is unordered-list indentation, and it measures depth where this file needs
# alignment.
#
# The sub-points under a numbered step sit at five columns because that is where
# the parent's text starts - two for the list, three for "5. ". Indent them to the
# two the rule asks for and they stop belonging to the step at all. The rule
# counts nesting levels and has no way to say "align with the ordered item above",
# so what it reports here is the document being right.
MD007: false
