version: "2"

run:
  timeout: 5m

  # Without these, the integration and browser suites are invisible to the
  # linter: their build tags exclude them, so roughly fifteen hundred lines that
  # decide whether a release is trustworthy were the only code here nothing
  # checked.
  # firefox is here for the same reason as the other two, and was missed when
  # they were added: test/firefox is another few hundred lines that decide
  # whether a release is trustworthy, and the linter could not see them. It was
  # then listed twice, which is harmless and still says the wrong thing about
  # how carefully this list is read.
  build-tags:
    - integration
    - browser
    - firefox

linters:
  default: standard

  settings:
    staticcheck:
      # ST1000 - "at least one file in a package should have a package comment"
      # - is what this block exists to switch on, and it needs switching on
      # because golangci-lint leaves it out of its own default check set.
      #
      # Measured rather than assumed: this tree carried forty-nine ST1000
      # reports and one ST1020 while a plain `golangci-lint run` said "0
      # issues". Both were being excluded, so nothing here had ever asked either
      # question - and the ST1020 was not a style quibble but a doc comment
      # attached to the wrong method, which `go doc` had been printing under the
      # wrong name for as long as it existed.
      #
      # It is on because the convention was already the tree's own before
      # anything enforced it: twenty-seven of thirty-eight packages opened with a
      # package comment, and the six that did not were the ones holding the rules
      # hardest to rediscover from the code - the domain vocabulary, the storage
      # interfaces, the domain rules, and the three DTO packages.
      #
      # ST1020, ST1021 and ST1022 are on for the reason above rather than for
      # tidiness. They are one rule applied to three kinds of declaration - a
      # doc comment starts with the name of what it documents - and what makes
      # that worth enforcing here is the mechanism: the check compares the
      # comment's first word against the declaration the *toolchain* attached it
      # to, so it fires when a comment has drifted onto the wrong thing. That is
      # a fault reading the file cannot show and no test here caught.
      #
      # ST1003 is the one left off, and deliberately: it judges names rather
      # than form, so a disagreement with it is a disagreement about taste and
      # is more expensive to settle than the comment-shape checks. ST1016
      # (consistent receiver names) is on - mechanical, no taste in it, and
      # nothing in this tree to fix for it.
      #
      # `checks` replaces the default list rather than adding to it, and
      # golangci-lint offers no way to read what that default is, so this is
      # written out. It is therefore wider than the default: the whole
      # staticcheck set apart from ST1003, QF included. Checked before
      # committing to it - with everything on, this tree reported nothing beyond
      # the ST1000s and the single ST1020, both now fixed.
      checks:
        - all
        - -ST1003

formatters:
  enable:
    - gofmt
    - goimports
