# Throwaway backing services for trying the application against something
# other than SQLite, and against a real directory.
#
# Everything here is deliberately insecure and deliberately ephemeral: fixed
# trivial passwords, no volumes, no restart policy. It exists so a database
# connection and an LDAP bind can be exercised for real, and it must never be
# mistaken for a deployment example - see ../Dockerfile for that.
#
#   docker compose --profile dev up -d       PostgreSQL + directory + Jaeger
#   docker compose --profile postgres up -d
#   docker compose --profile ldap up -d
#   docker compose --profile traces up -d    Jaeger, for the trace exporter
#   docker compose --profile stage up -d     the shipped image, and everything
#                                            it can be exercised against
#   docker compose --profile all up -d       ...plus MySQL
#
# Profiles keep it to what is needed: starting three databases to test one is
# a slow way to find out the third does not fit in memory.

name: gtr-test

services:
  postgres:
    image: postgres:17-alpine
    profiles: [postgres, dev, all, stage]
    environment:
      POSTGRES_DB: go-time-recording
      POSTGRES_USER: gtr
      POSTGRES_PASSWORD: gtr-test-password
    ports:
      - "55432:5432"
    healthcheck:
      # pg_isready alone reports the socket is up while the server is still
      # replaying its bootstrap, so a real query is the check.
      test: ["CMD-SHELL", "pg_isready -U gtr -d go-time-recording && psql -U gtr -d go-time-recording -c 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    profiles: [mysql, all]
    environment:
      MYSQL_DATABASE: go-time-recording
      MYSQL_USER: gtr
      MYSQL_PASSWORD: gtr-test-password
      MYSQL_ROOT_PASSWORD: gtr-test-root
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugtr", "-pgtr-test-password"]
      interval: 3s
      timeout: 5s
      retries: 30

  # A seeded OpenLDAP. The seed is the point: it holds the cases the
  # synchronisation has to get right, not just a user that can bind.
  #
  # The image is the deployment one, built from ../deploy/ldap, and this handles
  # it the way the two databases above are handled - the real thing, given a
  # throwaway password and thrown away afterwards. There used to be a near-copy
  # of that image here, which meant the same forty lines of directory
  # configuration in two places and a bind exercised against an image no
  # deployment ever runs. The directory was only ever built rather than pulled
  # because there is no usable OpenLDAP image to pull; now that this repository
  # has one, it is the one to test against.
  openldap:
    profiles: [ldap, dev, all, stage]
    build:
      context: ../deploy/ldap
    environment:
      # Weak on purpose, and the only difference that matters between this and a
      # deployment: same image, throwaway inputs. cn=admin is what the probe and
      # the healthcheck bind as; cn=service is what the application binds as
      # once the directory card is filled in.
      LDAP_ADMIN_PASSWORD: gtr-test-password
      LDAP_BIND_PASSWORD: gtr-test-password
    volumes:
      # Loaded after the structure the image seeds, so it can put people into
      # the ou=people that structure creates. Read-only: a test that could edit
      # its own fixture is a test that stops describing what it checks.
      - ./ldap/people.ldif:/seed/extra/people.ldif:ro
    ports:
      - "5389:389"
    healthcheck:
      # A real search for a real entry, not a port check: an empty directory
      # answers on 389 just as readily as a seeded one, and would pass.
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:389 -b dc=example,dc=com -D 'cn=admin,dc=example,dc=com' -w gtr-test-password '(uid=alice)' | grep -q '^dn:'"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Somewhere for exported spans to land. Without it the tracing settings can be
  # shown to reach GoFr, but not that a single span ever arrives anywhere - and
  # every way that fails is silent: an exporter GoFr does not recognise, a
  # collector address it cannot dial, a sampler that records nothing.
  jaeger:
    profiles: [traces, dev, all, stage]
    build: ./jaeger
    ports:
      # 4317 is where the application exports to; 51686 serves the query API the
      # tests read back from, and the trace browser for looking at one by hand.
      # Unusual on purpose, like the rest here, so a Jaeger already running on
      # the default ports is left alone.
      - "54317:4317"
      - "51686:16686"

  # The application itself, built from the image that actually ships.
  #
  # This is the difference between the "stage" profile and everything else
  # here: `task dev` runs a binary compiled on your machine, which is fast but
  # is not the artifact anyone deploys. This one goes through the real
  # Dockerfile - the multi-stage build, the embedded assets, the non-root user,
  # the healthcheck - so a full run against it exercises what will be running
  # in production, not an approximation of it.
  app:
    profiles: [stage]
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: prod
      # Overrides the image's SQLite default: a staging run that quietly used a
      # file database would test the one thing production does not do.
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: go-time-recording
      DB_USER: gtr
      DB_PASSWORD: gtr-test-password
      DB_SSL_MODE: disable
      # Exporting for real, because a staging run that traced nothing would
      # leave the one path nobody can check from a unit test unexercised. The
      # service name inside the network, and no scheme in front of it - GoFr
      # hands this to a gRPC dialer, which reads "http://" as part of the host.
      TRACE_EXPORTER: otlp
      TRACER_URL: jaeger:4317
      TRACER_RATIO: "1"
    ports:
      - "8080:8000"
      - "8021:2121"
    depends_on:
      postgres:
        condition: service_healthy
      openldap:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  # Runs the connection probe from inside the network, where the service names
  # resolve and the published ports do not. A check that passes from the host
  # but fails here is a networking problem, not a credentials problem.
  probe:
    profiles: [probe]
    build:
      # The repository root, so the probe is built from the application's own
      # go.mod and connects with the same drivers it does.
      context: ..
      dockerfile: test/Dockerfile.probe
    command:
      - --db=postgres
      - --dsn=postgres://gtr:gtr-test-password@postgres:5432/go-time-recording?sslmode=disable
      # The container port, not the published one: inside the network the
      # service name resolves and 5389 does not exist.
      - --ldap=ldap://openldap:389
      - --base-dn=dc=example,dc=com
      - --bind-dn=cn=admin,dc=example,dc=com
      - --bind-password=gtr-test-password

  # A browser for the directory, for when a failing bind needs looking at
  # rather than guessing at.
  #
  # On the staging profile too, and there it earns its place twice over: the
  # image is handed no LDAP settings at all, so somebody types them into the
  # running application by hand, and a typo in a base DN is indistinguishable
  # from an empty directory until the entries can be seen.
  ldap-ui:
    image: osixia/phpldapadmin:0.9.0
    profiles: [ldap, dev, all, stage]
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "5080:80"
    depends_on:
      openldap:
        condition: service_healthy
