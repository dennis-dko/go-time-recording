# OpenLDAP configuration for the disposable test directory.
#
# The classic single-file form rather than the cn=config tree, because the
# whole point of this file is that someone can read it and see what the server
# is doing. cn=config is the modern way to run a directory that changes while
# it serves; this one never changes.

include		/etc/ldap/schema/core.schema
include		/etc/ldap/schema/cosine.schema
include		/etc/ldap/schema/inetorgperson.schema
include		/etc/ldap/schema/nis.schema

pidfile		/var/run/slapd/slapd.pid
argsfile	/var/run/slapd/slapd.args

modulepath	/usr/lib/ldap
moduleload	back_mdb.la

database	mdb
suffix		"dc=example,dc=com"
rootdn		"cn=admin,dc=example,dc=com"

# Plain text, because this directory is thrown away and a hash here would only
# obscure what the password is. Nothing in this file belongs near a real
# deployment.
rootpw		gtr-test-password

directory	/var/lib/ldap
maxsize		268435456

# entryUUID is what the application matches accounts on, so it has to be
# indexed - and, more to the point, it has to be present. slapd assigns it to
# every entry automatically, which is exactly why it is the right thing to
# match on: unlike a mail address, nobody can change it.
index		objectClass	eq
index		uid,mail	eq,sub
index		entryUUID	eq

# Anonymous callers may not read the directory: the application binds as a
# service account, and a test server that answers unauthenticated searches
# would hide a missing bind configuration rather than expose it.
access to attrs=userPassword
	by self write
	by anonymous auth
	by * none

access to *
	by self read
	by users read
	by * none
