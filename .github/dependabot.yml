# Dependabot opens the pull request that a warning does not.
#
# The alerts were already on, and an alert is a message: it says a dependency has
# a known problem and leaves somebody to go and fix it. The security pass found
# what that costs. Seven advisories against the pinned Go release had call paths
# from this code - an XML decoder with no recursion limit, fed by every
# spreadsheet import, among them - and all seven had been fixed in the next patch
# release. go.mod pins a patch version on purpose, so nothing arrives by drift,
# which is right and is also why they sat there: the fix was published and
# nothing here was asking.
#
# The Vulnerabilities job asks now. This offers the fix.
version: 2

updates:
  # The application's own dependencies.
  #
  # Grouped, and weekly rather than daily: a repository this size does not need
  # eleven pull requests on a Tuesday, and every one of them costs a full CI run
  # across three databases and two browsers.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-dependencies:
        patterns:
          - "*"

  # The image this ships as, and the probe the integration suite builds.
  #
  # Two entries because Dependabot reads one directory each, and the two
  # Dockerfiles do not live together. They pin the same Go release as go.mod and
  # are meant to stay that way, so a bump to one that leaves the other behind is
  # something to look at rather than to merge.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /test
    schedule:
      interval: weekly
      day: monday

  # The images the deployment runs beside the application: the database, the
  # trace collector and the updater's Docker CLI.
  #
  # docker-compose rather than docker. The docker ecosystem reads Dockerfiles
  # and Kubernetes YAML and nothing else, so this entry failed every week with
  # "No Dockerfiles nor Kubernetes YAML found in /deploy" and no image here ever
  # moved. The compose ecosystem matches its files by
  # /(docker-)?compose(-[\w]+)?(?>\.[\w-]+)?\.ya?ml/i - read in dependabot-core's
  # docker_compose/file_fetcher.rb - which takes in compose.yaml and every
  # overlay beside it, compose.tracing.yaml included.
  #
  # Major versions are left alone. A new PostgreSQL major refuses to start on
  # the previous major's data directory, so merging one would take down every
  # installation at its next pull - and CI, which starts on an empty database,
  # would pass it. The collector's and the CLI's majors change their
  # configuration. Each is a deliberate step, not a weekly bump.
  #
  # /test beside /deploy, in one entry, grouped by dependency. The test
  # environment runs the same backing services, and
  # TestTheBackingServicesMatchWhatADeploymentRuns fails when the two pins
  # disagree - so a bump to one directory alone was a red pull request by
  # construction: the first one this entry opened, Jaeger in /deploy only, was
  # exactly that. group-by: dependency-name makes one pull request per image
  # across both directories, so the pair moves together.
  - package-ecosystem: docker-compose
    directories:
      - /deploy
      - /test
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backing-services:
        patterns:
          - "*"
        group-by: dependency-name

  # The actions every workflow is built from. These are the ones nobody thinks
  # about until one is deprecated and a release cannot be cut.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
