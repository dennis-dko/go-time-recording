name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # version-file rather than "latest": with "latest" a run can fail on a
      # commit that passed yesterday, because a new release added a check. A
      # linter finding new problems is useful, but it should happen when the
      # file is bumped deliberately - not on an unrelated push, and least of
      # all while cutting a release.
      #
      # The version lives in a file so this workflow and release.yml cannot
      # drift apart, and so `golangci-lint --version` locally can be compared
      # against what CI will actually enforce.
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version

      # The deployment files are copied to a server and run there, and nothing
      # in this repository had ever parsed them: a typo in an overlay would be
      # found by whoever was deploying, at the moment they were deploying.
      #
      # `config` needs no daemon - it interpolates, merges the overlays and
      # validates the result, which is where the mistakes in a file like this
      # live. Every combination that is offered in the documentation is checked,
      # because merging is where they interact: compose.tls.yaml replaces the
      # published ports with !override and the other two only add services, so
      # the combinations are the thing worth proving rather than each file alone.
      #
      # The values come from .env.example plus the ones it deliberately leaves
      # empty. Those use the ${VAR:?} form, so this also checks that a missing
      # one is refused rather than defaulted to something nobody chose.
      - name: Deployment compose files
        working-directory: deploy
        run: |
          cp .env.example .env.ci
          cat >> .env.ci <<'ENV'
          DB_PASSWORD=ci-only-not-a-real-password
          TLS_DOMAINS=time.example.com
          TLS_EMAIL=ops@example.com
          LDAP_ADMIN_PASSWORD=ci-only-not-a-real-password
          LDAP_BIND_PASSWORD=ci-only-not-a-real-password
          ENV

          for files in \
            "-f compose.yaml" \
            "-f compose.yaml -f compose.tls.yaml" \
            "-f compose.yaml -f compose.tracing.yaml" \
            "-f compose.yaml -f compose.ldap.yaml" \
            "-f compose.yaml -f compose.tls.yaml -f compose.tracing.yaml" \
            "-f compose.yaml -f compose.tls.yaml -f compose.ldap.yaml -f compose.tracing.yaml"
          do
            echo "::group::compose $files"
            docker compose --env-file .env.ci $files config >/dev/null
            echo "::endgroup::"
          done

          # And that a required password is actually required. Without this the
          # loop above would pass just as happily on a file that had quietly
          # grown a default.
          if docker compose -f compose.yaml config >/dev/null 2>&1; then
            echo "compose.yaml started without DB_PASSWORD - the :? guard is gone" >&2
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  # The unit tests cover the rules; this covers everything between a request
  # arriving and a rule being reached - middleware order, CSRF, sessions,
  # migrations, embedded assets, the wiring in main.go. Run against both
  # dialects, because that gap is where the dialect actually shows.
  #
  # sqlite is in the matrix for more than symmetry. Five cases start two
  # instances against one shared database file - what an administrator saves
  # being applied by the next start - and on a server the harness gives each
  # instance a database of its own, so those five skip themselves whenever
  # GTR_TEST_DSN is set. The sqlite leg is the only place three of them run:
  # the directory schedule, and the two telemetry cases. The other two are the
  # tracing ones, which need a collector as well and so run in the directory and
  # tracing job below - which likewise leaves GTR_TEST_DSN unset, and has to.
  integration:
    name: Integration (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres, mysql]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: go-time-recording
          POSTGRES_USER: gtr
          POSTGRES_PASSWORD: gtr-test-password
        ports:
          - 5432:5432
        # Without this the tests start before the server can answer, and the
        # failure looks like a bug rather than a race.
        options: >-
          --health-cmd "pg_isready -U gtr -d go-time-recording"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: go-time-recording
          MYSQL_ROOT_PASSWORD: gtr-test-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pgtr-test-root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        env:
          # Empty for the sqlite leg: the harness falls back to a file per test.
          # root on MySQL, because each test creates its own database.
          GTR_TEST_DSN: ${{ matrix.dialect == 'postgres' && 'postgres://gtr:gtr-test-password@localhost:5432/go-time-recording?sslmode=disable' || matrix.dialect == 'mysql' && 'mysql://root:gtr-test-root@localhost:3306/go-time-recording' || '' }}
        run: go test -tags integration -count=1 -timeout 15m ./test/integration/

  # The two suites that were never run here at all.
  #
  # Both guard themselves on an environment variable - GTR_TEST_LDAP and
  # GTR_TEST_JAEGER - and nothing in this workflow set either, so both skipped in
  # every run since they were written. A test binary that skips everything exits
  # 0 and looks exactly like one that passed, which is why nobody noticed. What
  # went unchecked is the directory reconciliation: the one operation in this
  # application that deletes accounts together with the hours they recorded.
  #
  # Their services are built from this repository rather than pulled, so GitHub's
  # `services:` cannot start them - it only takes prebuilt images. Compose is on
  # the runner anyway, and the profiles already exist for `task test:ldap` and
  # `task test:traces`, so the same ones are used here.
  #
  # Roughly four minutes, run in parallel with the other jobs.
  directory-and-tracing:
    name: Directory and tracing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Start the directory and the collector
        working-directory: test
        run: docker compose --profile ldap --profile traces up -d --build --wait

      # No GTR_TEST_DSN, and that is load-bearing rather than an omission: five
      # integration cases start two instances against one shared SQLite file and
      # skip themselves whenever a server DSN is set. Three of those are the
      # directory schedule and the two tracing cases this job exists for.
      - name: Directory and tracing tests
        env:
          GTR_TEST_LDAP: localhost:5389
          GTR_TEST_JAEGER: localhost:54317
          GTR_TEST_JAEGER_QUERY: http://localhost:51686
        run: |
          set -euo pipefail
          go test -tags integration -count=1 -timeout 15m -v \
            -run 'Directory|LDAP|BaseDN|MailAddress|Synchronisation|NeverProposed|Tracing' \
            ./test/integration/ | tee results.txt

          # The whole point of this job, asserted rather than assumed. Skipping is
          # how these went unnoticed for their entire existence, so a run where
          # they skip again has to be a red one - and a -run pattern that matches
          # nothing also exits 0, which would look the same.
          if grep -q -- '--- SKIP' results.txt; then
            echo "::error::a case skipped; this job exists because skipping is invisible"
            grep -- '--- SKIP' results.txt
            exit 1
          fi

          if ! grep -q -- '--- PASS: TestDirectory\|--- PASS: TestTracing\|--- PASS: Test.*Synchronisation' results.txt; then
            echo "::error::no directory or tracing case ran; check the -run pattern"
            exit 1
          fi

      - name: Stop them
        if: always()
        working-directory: test
        run: docker compose --profile ldap --profile traces down -v

  # Drives the real interface in a real browser. The integration tests prove the
  # API answers correctly; these prove the application is usable - that the
  # sign-in overlay goes away, that a tab switch shows the right panel, that a
  # stylesheet rule has not quietly beaten the hidden attribute. Those failures
  # leave every API check passing.
  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # ubuntu-latest ships Chrome, but pinning the action means the tests do
      # not start failing the day the runner image drops it.
      #
      # install-dependencies because of what changed in v2: "stable" now comes
      # from Chrome for Testing rather than the official installer, and that is
      # an unpacked archive with no package manager to pull in the shared
      # libraries it links against. The runner happens to have most of them
      # today; a missing one surfaces as the browser exiting instantly, which
      # reads like a broken test rather than a missing .so.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Browser tests
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        # -v so a failure names the case and the log shows which steps ran
        # before it. Without it a browser failure is a package name and a
        # timeout, with nothing to say which click never landed.
        run: go test -tags browser -count=1 -timeout 20m -v ./test/browser/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # ./cmd rather than ./cmd/main.go: naming the file builds that file, so a
      # second one added to the package would be left out of the check that is
      # supposed to prove the package builds.
      - run: go build -o /dev/null ./cmd

      # Every platform a release publishes, on this one runner - there is no cgo
      # anywhere in the tree, so GOOS and GOARCH are all it takes.
      #
      # It belongs here because nothing else looks. Every other job runs on
      # ubuntu/amd64, and this tree has files that only exist for one platform:
      # restart_unix.go and restart_other.go are selected by build tag, so the
      # Windows half is never compiled by lint, vet or test, and a break in it
      # passes all of CI. The release then cross-compiles for real and fails -
      # after the merge, on a commit that is already on main, leaving that commit
      # unreleasable and the reason a long way from the change that caused it.
      #
      # vet as well as build, because vet is what reads the file rather than only
      # linking it, and it is the half that finds a mistake worth finding.
      - name: Cross-compile every published platform
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "==> ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o /dev/null ./cmd
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go vet ./...
          done

  # Builds the Docker image on every PR as a smoke test. On pushes to main
  # it additionally publishes a rolling ":edge" image to GHCR, so main
  # always has a deployable artifact without waiting for a version tag.
  # Versioned releases are handled separately by release.yml.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, integration, directory-and-tracing, browser, build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (smoke test)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: go-time-recording:ci

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & push edge image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Without this the binary and the labels both say "dev", so the version
          # in the footer of a deployed image would answer "which build is this?"
          # with "a build".
          build-args: |
            VERSION=edge-${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:edge
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
