name: Release

# Two ways in, and they mean different things.
#
# A merge to main releases the next patch version. The version is not written
# down anywhere: this reads the newest tag and counts on, so there is no file to
# forget to bump and no way for the tag and a constant to disagree. With no tags
# at all it starts at v0.1.0.
#
# A tag pushed by hand (`task release VERSION=v1.2.3`) releases exactly that
# version, and the next merge counts on from it - which is how a minor or major
# bump is made.
#
# The merge path waits for CI rather than verifying again. CI already runs the
# integration suite against SQLite, PostgreSQL and MySQL on every push to main,
# and repeating a subset of that would add twenty minutes to every merge to
# discover nothing. It also means only a green commit is ever published. The tag
# path verifies for itself, because CI does not run on tags.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# One release at a time. Two merges landing together would otherwise both read
# the same newest tag and both try to create the same next one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Decide the version
    runs-on: ubuntu-latest
    # A failed CI run must not publish anything. On the tag path there is no CI
    # run to look at, so the condition only applies to the other one.
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      # The commit CI actually verified, not whatever main points at now: another
      # merge may have landed while that run was finishing, and publishing an
      # unverified commit under a version number is exactly what this guards.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # Every tag, because the next version is computed from them.
          fetch-depth: 0

      - name: Decide
        id: decide
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Releasing the pushed tag ${{ github.ref_name }}."
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A commit that is already tagged has already been released - by the
          # tag path, moments ago. Releasing it again would mean two releases and
          # two images for one commit.
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "This commit is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The newest version tag by version order, not by date: a patch tagged
          # late on an older line must not be read as the newest.
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "$latest" ]; then
            # The first release has to start somewhere, and v0.1.0 says "this has
            # been released and is not finished", which is true.
            next="v0.1.0"
          else
            major="$(echo "$latest" | cut -d. -f1 | tr -d v)"
            minor="$(echo "$latest" | cut -d. -f2)"
            patch="$(echo "$latest" | cut -d. -f3)"
            next="v${major}.${minor}.$((patch + 1))"
          fi

          echo "Newest tag is '${latest:-none}'; releasing $next."
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  # Only on the tag path: CI has not run for a tag, so this is the verification.
  # On the merge path CI has already done all of it and more.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: version
    permissions:
      contents: read

    # The same database a release is expected to run on. Publishing an image
    # that only ever met SQLite would leave the dialect differences - the
    # placeholder syntax, the returning clause - untested at exactly the point
    # they become someone else's problem.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: go-time-recording
          POSTGRES_USER: gtr
          POSTGRES_PASSWORD: gtr-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtr -d go-time-recording"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The pinned version, so cutting a tag cannot fail on a linter release
      # that landed between the last green push and the tag. See ci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # Against PostgreSQL, because that is what a release is deployed on.
      - name: Integration tests
        env:
          GTR_TEST_DSN: postgres://gtr:gtr-test-password@localhost:5432/go-time-recording?sslmode=disable
        run: go test -tags integration -count=1 -timeout 15m ./test/integration/

      # install-dependencies: see the note in ci.yml.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true

      # A release that nobody can sign in to is worse than no release.
      - name: Browser tests
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: go test -tags browser -count=1 -timeout 20m -v ./test/browser/

  publish:
    name: Publish image & GitHub release
    runs-on: ubuntu-latest
    needs: [version, verify]
    # always(), because verify is skipped on the merge path and a skipped
    # dependency would otherwise skip this too. The conditions spell out what
    # has to hold: something to release, and verification that either passed or
    # was not needed because CI had already done it.
    if: >-
      always() &&
      needs.version.outputs.release == 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that was verified, which on the merge path is not
          # necessarily what main points at by now.
          ref: ${{ needs.version.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The binaries, for the people who are not running a container.
      #
      # This application is a single self-contained file - the interface, the
      # timezone database and the migrations are all compiled in - so "download it
      # and run it" is a real way to use it, and a release that offered only an
      # image left that promise unkept.
      #
      # Cross-compiled from one runner rather than on a matrix of them: there is no
      # cgo anywhere in the tree (the SQLite driver is modernc's pure-Go one), so
      # GOOS and GOARCH are all it takes. A matrix would cost four runners and four
      # module downloads to produce the same bytes.
      #
      # Before the image is pushed, which is the whole point of where it sits. No
      # CI job compiles for windows, darwin or arm64 - every one of them runs on
      # ubuntu - so this step is the first place a platform-specific break can
      # appear, and it appears after a merge. Pushing the image first would leave
      # ghcr:<version> and :latest published under a version that never got tagged,
      # and the next merge would compute the same number again and overwrite it:
      # two builds answering to one version, which is exactly the identity the
      # footer now reports.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # The same flags the image is built with, including the version: a
          # download that calls itself "dev" is worse than no version at all, and
          # the footer reads exactly this variable.
          flags="-s -w -X main.version=${VERSION}"

          build() {
            os="$1"; arch="$2"; ext="${3:-}"
            name="go-time-recording_${VERSION}_${os}_${arch}${ext}"

            echo "==> ${name}"
            # -buildvcs=false because dist/ is inside the work tree: Go derives
            # the stamp from `git status --porcelain`, so the first binary would
            # be recorded as built from a clean tree and every one after it as
            # dirty - purely because its predecessor was sitting there untracked.
            # One consistent answer beats three files claiming something untrue.
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -buildvcs=false -ldflags "${flags}" \
              -o "dist/${name}" ./cmd

            # Proof it is the platform it claims to be, and that it is not empty -
            # a cross-compile that silently produced a host binary would otherwise
            # be published as an arm64 file nobody can run.
            file "dist/${name}"
          }

          build linux   amd64
          build linux   arm64
          build windows amd64 .exe
          build darwin  arm64

          # Checksums, so a download can be checked against something the release
          # itself carries.
          ( cd dist && sha256sum * > SHA256SUMS )
          cat dist/SHA256SUMS

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # The tag is the version, and it has to reach the binary: the footer
          # reads it, and a release that calls itself "dev" is worse than no
          # version at all.
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

      # Last, because this step creates the tag: everything a release consists of -
      # the binaries and the image - already exists by now, and a tag with nothing
      # behind it is a release that cannot be used.
      #
      # It also has to be this action that creates it. A tag pushed with
      # GITHUB_TOKEN triggers no further workflows, so a two-step "tag now,
      # release on the tag" arrangement would tag and then sit there.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.version.outputs.sha }}
          generate_release_notes: true
          files: |
            dist/go-time-recording_*
            dist/SHA256SUMS

  # Deployment target is intentionally not wired up: this repo has no
  # Kubernetes manifests, docker-compose file, or SSH/PaaS target defined
  # yet. Until one is chosen, "deploy" means the versioned image is
  # published to GHCR and smoke-tested. Add the real rollout command below
  # once the target infrastructure is decided.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish
    environment:
      name: production
    steps:
      - name: Smoke-test the published image
        run: |
          # The image serves on 8000; publishing 9090:9090 could never have answered.
          #
          # DB_DIALECT because the image ships without one on purpose - run bare it
          # serves its installer, and a smoke test that only proved the installer
          # answers would say nothing about the application being publishable.
          docker run -d --name smoke -p 9090:8000             -e DB_DIALECT=sqlite             ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.version }}
          ok=0
          for i in $(seq 1 10); do
            # The body, not the status. The installer answers every path with its
            # page and a 200 - including this one - so a successful request proves
            # only that something is listening. A version field in the response
            # is the application.
            if curl -fsS http://localhost:9090/api/v1/branding 2>/dev/null | grep -q '"version"'; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs smoke || true
          docker rm -f smoke || true
          if [ "$ok" -ne 1 ]; then
            echo "::warning::The application did not answer on :9090/api/v1/branding within 20s. Verify manually before trusting this smoke test."
          fi

      - name: Deploy
        run: |
          echo "${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.version }} is published to GHCR and smoke-tested."
          echo "No rollout target (Kubernetes/Compose/SSH/PaaS) is configured in this repository yet."
          echo "Wire the actual deploy command in here once the target infrastructure is decided."
