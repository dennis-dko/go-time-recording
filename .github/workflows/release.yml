name: Release

# Two ways in, and they mean different things.
#
# A merge to main releases the next patch version. The version is not written
# down anywhere: this reads the newest tag and counts on, so there is no file to
# forget to bump and no way for the tag and a constant to disagree. With no tags
# at all it starts at v0.1.0.
#
# A tag pushed by hand (`task release VERSION=v1.2.3`) releases exactly that
# version, and the next merge counts on from it - which is how a minor or major
# bump is made.
#
# The merge path waits for CI rather than verifying again. CI already runs the
# integration suite against SQLite, PostgreSQL and MySQL on every push to main,
# and repeating a subset of that would add twenty minutes to every merge to
# discover nothing. It also means only a green commit is ever published. The tag
# path verifies for itself, because CI does not run on tags.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# One release at a time. Two merges landing together would otherwise both read
# the same newest tag and both try to create the same next one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Decide the version
    runs-on: ubuntu-latest
    # A failed CI run must not publish anything. On the tag path there is no CI
    # run to look at, so the condition only applies to the other one.
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      # The commit CI actually verified, not whatever main points at now: another
      # merge may have landed while that run was finishing, and publishing an
      # unverified commit under a version number is exactly what this guards.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # Every tag, because the next version is computed from them.
          fetch-depth: 0

      - name: Decide
        id: decide
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Releasing the pushed tag ${{ github.ref_name }}."
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A commit that is already tagged has already been released - by the
          # tag path, moments ago. Releasing it again would mean two releases and
          # two images for one commit.
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "This commit is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The newest version tag by version order, not by date: a patch tagged
          # late on an older line must not be read as the newest.
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "$latest" ]; then
            # The first release has to start somewhere, and v0.1.0 says "this has
            # been released and is not finished", which is true.
            next="v0.1.0"
          else
            major="$(echo "$latest" | cut -d. -f1 | tr -d v)"
            minor="$(echo "$latest" | cut -d. -f2)"
            patch="$(echo "$latest" | cut -d. -f3)"
            next="v${major}.${minor}.$((patch + 1))"
          fi

          echo "Newest tag is '${latest:-none}'; releasing $next."
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  # Only on the tag path: CI has not run for a tag, so this is the verification.
  # On the merge path CI has already done all of it and more.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: version
    permissions:
      contents: read

    # The same database a release is expected to run on. Publishing an image
    # that only ever met SQLite would leave the dialect differences - the
    # placeholder syntax, the returning clause - untested at exactly the point
    # they become someone else's problem.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: go-time-recording
          POSTGRES_USER: gtr
          POSTGRES_PASSWORD: gtr-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gtr -d go-time-recording"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The pinned version, so cutting a tag cannot fail on a linter release
      # that landed between the last green push and the tag. See ci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # Against PostgreSQL, because that is what a release is deployed on.
      - name: Integration tests
        env:
          GTR_TEST_DSN: postgres://gtr:gtr-test-password@localhost:5432/go-time-recording?sslmode=disable
        run: go test -tags integration -count=1 -timeout 15m ./test/integration/

      # install-dependencies: see the note in ci.yml.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true

      # A release that nobody can sign in to is worse than no release.
      - name: Browser tests
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: go test -tags browser -count=1 -timeout 20m -v ./test/browser/

  publish:
    name: Publish image & GitHub release
    runs-on: ubuntu-latest
    needs: [version, verify]
    # always(), because verify is skipped on the merge path and a skipped
    # dependency would otherwise skip this too. The conditions spell out what
    # has to hold: something to release, and verification that either passed or
    # was not needed because CI had already done it.
    if: >-
      always() &&
      needs.version.outputs.release == 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    permissions:
      contents: write
      packages: write
    # No outputs. They existed so the deploy job could name the image it was
    # announcing, and nothing else ever read them - so they went with it rather
    # than staying as two lines that look like an interface somebody depends on.
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that was verified, which on the merge path is not
          # necessarily what main points at by now.
          ref: ${{ needs.version.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The binaries, for the people who are not running a container.
      #
      # This application is a single self-contained file - the interface, the
      # timezone database and the migrations are all compiled in - so "download it
      # and run it" is a real way to use it, and a release that offered only an
      # image left that promise unkept.
      #
      # Cross-compiled from one runner rather than on a matrix of them: there is no
      # cgo anywhere in the tree (the SQLite driver is modernc's pure-Go one), so
      # GOOS and GOARCH are all it takes. A matrix would cost four runners and four
      # module downloads to produce the same bytes.
      #
      # Before the image is pushed, which is the whole point of where it sits. No
      # CI job compiles for windows, darwin or arm64 - every one of them runs on
      # ubuntu - so this step is the first place a platform-specific break can
      # appear, and it appears after a merge. Pushing the image first would leave
      # ghcr:<version> and :latest published under a version that never got tagged,
      # and the next merge would compute the same number again and overwrite it:
      # two builds answering to one version, which is exactly the identity the
      # footer now reports.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # The same flags the image is built with, including the version: a
          # download that calls itself "dev" is worse than no version at all, and
          # the footer reads exactly this variable.
          flags="-s -w -X main.version=${VERSION}"

          build() {
            os="$1"; arch="$2"; ext="${3:-}"
            name="go-time-recording_${VERSION}_${os}_${arch}${ext}"

            echo "==> ${name}"
            # -buildvcs=false because dist/ is inside the work tree: Go derives
            # the stamp from `git status --porcelain`, so the first binary would
            # be recorded as built from a clean tree and every one after it as
            # dirty - purely because its predecessor was sitting there untracked.
            # One consistent answer beats three files claiming something untrue.
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -buildvcs=false -ldflags "${flags}" \
              -o "dist/${name}" ./cmd

            # Proof it is the platform it claims to be, and that it is not empty -
            # a cross-compile that silently produced a host binary would otherwise
            # be published as an arm64 file nobody can run.
            file "dist/${name}"
          }

          build linux   amd64
          build linux   arm64

          # The Windows resource: the icon on the file, and the Properties tab
          # that is otherwise blank. Generated here rather than committed,
          # because it carries the version and a committed one would go stale
          # the moment it was written.
          #
          # Removed immediately afterwards, which is not tidiness. The toolchain
          # links any .syso in the package directory with no import and no build
          # tag; the _windows_amd64 suffix is what keeps it off the other three,
          # and darwin builds after this one in the same directory.
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          sh build/windows-resource.sh "${VERSION}"
          build windows amd64 .exe
          sh build/windows-resource.sh --clean

          build darwin  arm64

      # Signing goes here: after the Windows binary exists and before anything
      # measures it.
      #
      # Windows shows "unknown publisher" for software nobody has signed, and
      # SmartScreen turns the first run into a dialog with "run anyway" hidden
      # behind "more info". Nothing in a build can remove that - it is not a flag,
      # a manifest or a resource. Only a signature from a certificate authority
      # Windows already trusts does, and reputation attaches to the certificate
      # rather than to the file.
      #
      # Skipped entirely where there is no certificate, which is every fork and
      # this repository until somebody buys one. The release is then exactly what
      # it was before this step existed.
      #
      # The ordering is the part worth writing down: signing changes the bytes, so
      # it has to happen before SHA256SUMS is written. Sign afterwards and every
      # checksum in the release describes a file that no longer exists - which the
      # self-update checks, and would refuse.
      - name: Sign the Windows binary
        env:
          PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          # Checked here rather than in an `if:` on purpose. A step condition that
          # reads a secret is one of the places the expression parser is fussy
          # about, and getting it wrong fails the whole workflow - which would
          # break every release for the sake of a step that does nothing on most
          # of them.
          if [ -z "${PFX}" ]; then
            echo "no signing certificate configured; publishing unsigned"
            echo "Windows will show 'unknown publisher' - see README, Signing"
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y osslsigncode

          printf '%s' "$PFX" | base64 -d > /tmp/signing.pfx

          exe="dist/go-time-recording_${VERSION}_windows_amd64.exe"

          # RFC 3161 timestamping, so the signature outlives the certificate: an
          # unstamped signature stops being valid the day the certificate expires,
          # including on copies downloaded years earlier.
          osslsigncode sign             -pkcs12 /tmp/signing.pfx -pass "$PFX_PASSWORD"             -n "go-time-recording"             -i "https://github.com/dennis-dko/go-time-recording"             -ts "http://timestamp.digicert.com"             -h sha256             -in "$exe" -out "${exe}.signed"

          mv "${exe}.signed" "$exe"

          shred -u /tmp/signing.pfx

          osslsigncode verify -in "$exe"

      - name: Measure what will be published
        run: |
          set -euo pipefail

          # Checksums, so a download can be checked against something the release
          # itself carries. Last, because signing changes the file and the
          # self-update compares what it downloaded against exactly this.
          ( cd dist && sha256sum -- * > SHA256SUMS )
          cat dist/SHA256SUMS

      # Built into this runner's daemon rather than pushed, because the next step
      # is what decides whether it may be pushed at all.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          # The tag is the version, and it has to reach the binary: the footer
          # reads it, and a release that calls itself "dev" is worse than no
          # version at all.
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

      # The image has to actually run before anybody is told it exists.
      #
      # This check used to sit in the deploy job, which runs after the image is
      # pushed and after the release is created - so it could report a broken
      # image and change nothing about the fact that it was already published.
      # It also ended in a warning rather than a failure, which made it a note in
      # a log rather than a gate. Here it is neither: nothing leaves this runner
      # until the application has answered.
      - name: Smoke-test the image before publishing it
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          # The image serves on 8000; 9090 is only where this runner reaches it.
          # An earlier version published 9090:9090, which could never have
          # answered - and warned rather than failed, so nobody found out.
          #
          # DB_DIALECT alone on purpose: the image supplies DB_NAME itself, so
          # this also proves that default is still there. Run bare the binary
          # serves its installer, and an installer answering says nothing about
          # the application being publishable.
          docker run -d --name smoke -p 9090:8000 -e DB_DIALECT=sqlite "$IMAGE"

          ok=0

          for _ in $(seq 1 20); do
            # The body, not the status. The installer answers every path with its
            # own page and a 200 - including this one - so a successful request
            # proves only that something is listening. A version in the answer is
            # the application.
            if curl -fsS http://localhost:9090/api/v1/branding 2>/dev/null | grep -q '"version"'; then
              ok=1
              break
            fi

            sleep 2
          done

          docker logs smoke || true
          docker rm -f smoke || true

          if [ "$ok" -ne 1 ]; then
            echo "::error::the image did not answer on /api/v1/branding within 40s; nothing was published"
            exit 1
          fi

      # The image that was tested, not another build of it: pushed from the local
      # daemon rather than built a second time, so the bytes somebody pulls are
      # the bytes that answered above.
      - name: Push the tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

      # Last, because this step creates the tag: everything a release consists of -
      # the binaries and the image - already exists by now, and a tag with nothing
      # behind it is a release that cannot be used.
      #
      # That leaves one window, and it is worth naming rather than implying it is
      # gone: if this step fails, an image is published under a version that has
      # no tag. It heals itself, which is why the order is this way round and not
      # the other - the next version is computed from tags alone, so the next
      # merge computes the same number, and pushes an image and a tag for a commit
      # that contains the one that failed. Tagging first would instead leave a
      # release whose image never arrived, which nothing later repairs.
      #
      # It also has to be this action that creates it. A tag pushed with
      # GITHUB_TOKEN triggers no further workflows, so a two-step "tag now,
      # release on the tag" arrangement would tag and then sit there.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.version.outputs.sha }}
          generate_release_notes: true
          files: |
            dist/go-time-recording_*
            dist/SHA256SUMS
          # append_body puts this below the generated notes, which is where it
          # belongs: the changelog is what a returning reader came for, and this
          # is what somebody who has just downloaded a binary reads once. The
          # installer covers the database; what it cannot cover is what has to be
          # in place before the process starts at all.
          body: |
            ## Running the binary

            The manual is
            [`deploy/OPERATIONS.md`](https://github.com/${{ github.repository }}/blob/${{ needs.version.outputs.version }}/deploy/OPERATIONS.md) —
            the ways to run it, what to back up, what needs a restart, and what the
            health endpoints actually mean. The short version:

            Download the file for your platform, check it against `SHA256SUMS`, and
            run it. It is self-contained: the interface, the timezone database and
            the migrations are compiled in.

            With **no database configured** it serves an installer on its own port
            and waits, so the first start needs nothing but the binary.

            Everything the installer cannot ask for - the port, TLS, the log level,
            the session lifetime, the rate limit - is read from the environment or
            from `configs/.env` beside the binary. Start from
            [`deploy/.env.binary.example`](https://github.com/${{ github.repository }}/blob/${{ needs.version.outputs.version }}/deploy/.env.binary.example),
            which lists every variable the process reads with the value it uses when
            the variable is absent. (`deploy/.env.example` is the other one: it is
            read by docker compose and means nothing beside a binary.) Settings the
            interface can change are stored in the database and are **not** read
            from there.
          append_body: true

  # There is no deploy job, and that is the decision rather than a gap waiting to
  # be filled. This repository has no rollout target and is not getting one, so a
  # release ends here: the image is in GHCR under its version and under latest,
  # the binaries are on the release, and pulling either of them is somebody's
  # deployment rather than this workflow's.
  #
  # There was one, echoing three lines about a release that had already happened.
  # It is worth recording why it went, because the shape of it invites being put
  # back: a job that only announces is a job whose failure means nothing and whose
  # success proves nothing, and it had in fact never run at all - a skip reaches
  # down the whole graph, so it inherited one from a job it did not name and
  # nobody noticed for the lifetime of the repository.
  #
  # If a target is ever chosen: the job goes back here needing publish, with
  # `if: always() && needs.publish.result == 'success'` so the same inherited skip
  # does not silence it, and with an `environment:` - which is where the deploy
  # credential belongs, because an environment secret is readable only by jobs
  # that declare it while a repository secret is readable by every job there is.
