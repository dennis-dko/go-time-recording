name: Release

# Cuts a release from an annotated version tag (created by `task release
# VERSION=v1.2.3`, which just tags and pushes - this workflow does the rest).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  publish:
    name: Publish image & GitHub release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # Deployment target is intentionally not wired up: this repo has no
  # Kubernetes manifests, docker-compose file, or SSH/PaaS target defined
  # yet. Until one is chosen, "deploy" means the versioned image is
  # published to GHCR and smoke-tested. Add the real rollout command below
  # once the target infrastructure is decided.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish
    environment:
      name: production
    steps:
      - name: Smoke-test the published image
        run: |
          # The image serves on 8000; publishing 9090:9090 could never have answered.
          docker run -d --name smoke -p 9090:8000 ${{ needs.publish.outputs.image }}:${{ github.ref_name }}
          ok=0
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:9090/ >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs smoke || true
          docker rm -f smoke || true
          if [ "$ok" -ne 1 ]; then
            echo "::warning::Container did not respond on :9090/ within 20s. Verify manually before trusting this smoke test."
          fi

      - name: Deploy
        run: |
          echo "${{ needs.publish.outputs.image }}:${{ github.ref_name }} is published to GHCR and smoke-tested."
          echo "No rollout target (Kubernetes/Compose/SSH/PaaS) is configured in this repository yet."
          echo "Wire the actual deploy command in here once the target infrastructure is decided."
